<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 902" width="900" role="img" aria-label="Wiring diagram for the ESP32 screw-terminal breakout. Left terminals: D32 top button, D33 grey wire 8 E, D25 brown wire 1 R1, D26 red wire 2 G1, D27 orange wire 3 B1, D14 green wire 5 R2, D12 blue wire 6 G2, D13 purple wire 7 B2, GND yellow wire 4 and the power negative, VIN power positive. Right terminals: D23 white wire 9 A, D19 black wire 10 B, D18 bottom button, D5 brown wire 11 C, TX2 red wire 12 D, RX2 orange wire 13 CLK, D4 yellow wire 14 LAT, D15 green wire 15 OE, GND blue wire 16 and the buttons' ground.">
